name: Hydrate Coach Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ANON_KEY:     ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SCHEMA:       ${{ secrets.SUPABASE_SCHEMA }}
      SUPABASE_CACHE_BUCKET: ${{ secrets.SUPABASE_CACHE_BUCKET }}
      NODE_ENV:              production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo tree (top 2 levels)
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type d | sort

      - name: Detect API directory
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          for d in "apps/api" "api" "server" "backend" "."; do
            if [ -d "$d" ] && [ -f "$d/package.json" ] && [ -f "$d/scripts/hydrate.ts" ]; then
              real=$(cd "$d" && pwd)
              echo "Detected API_DIR=$d (resolved $real)"
              echo "API_DIR=$d" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Could not find an API directory with package.json + scripts/hydrate.ts" >&2
          exit 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm -v

      - name: DNS sanity check
        run: |
          set -e
          for host in statsapi.web.nhl.com api-web.nhle.com api.nhle.com; do
            if getent hosts "$host" >/dev/null 2>&1; then
              echo "[dns] $host resolves"
            else
              echo "[dns] $host does NOT resolve"
            fi
          done

      - name: Install API deps
        working-directory: ${`{ env.API_DIR }`}
        run: pnpm install --no-frozen-lockfile

      - name: Run hydrate script
        working-directory: ${{ env.API_DIR }}
        run: npx tsx scripts/hydrate.ts

      - name: Smoke check cache files
        working-directory: ${{ env.API_DIR }}
        run: |
          test -f cache/schedule.json
          test -f cache/stats.json
          echo "Cache present"


