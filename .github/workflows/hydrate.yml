name: Nightly Hydrate

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC  4:00 AM ET (standard time)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    env:
      DISABLE_LIVE_STATS: "false"
      REQUIRE_FRESH_HYDRATION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read season from config
        id: season
        run: echo "id=$(node -p "require('./config/season.json').seasonId")" >> "$GITHUB_OUTPUT"

      - run: npm install

      - name: Install apps/api dependencies
        run: npm install
        working-directory: apps/api

      - name: Typecheck hydration entrypoint
        run: npm run typecheck:hydrate
        working-directory: apps/api

      - name: Hydrate data cache
        run: npm run hydrate
        working-directory: apps/api
        env:
          STATS_SEASON: ${{ steps.season.outputs.id }}

      - name: Generate team stats from NHL API
        run: node apps/api/scripts/calculate-team-stats.mjs
        env:
          STATS_SEASON: ${{ steps.season.outputs.id }}

      - name: Finalize validated cache and manifest
        run: |
          mkdir -p apps/api/cache
          cp apps/api/cache/team_stats.json apps/api/data-cache/team_stats.json
          npm run manifest --prefix apps/api
          cp apps/api/data-cache/*.json apps/api/cache/

      - name: Copy hydrated data to root data directory for Vercel
        run: |
          mkdir -p data
          cp apps/api/data-cache/stats.json data/stats.json
          cp apps/api/data-cache/schedule.json data/schedule.json
          cp apps/api/data-cache/team_stats.json data/team_stats.json
          cp apps/api/src/data/players.json data/players.json
          cp server/data/teams.json data/teams.json
          echo "Copied hydrated data to data/ directory"

      # Optional enrichment: a Yahoo outage must not block the NHL data commit. The script
      # writes only after a complete, sane fetch, so on failure the last snapshot is kept.
      - name: Refresh Yahoo eligibility and injury status
        continue-on-error: true
        run: npm run data:yahoo-eligibility

      - name: Verify player directory identity after Yahoo refresh
        run: node scripts/validate-player-directories.mjs

      # Tiny public injury snapshot for My Team badges, derived from the Yahoo file above.
      - name: Build injury snapshot
        continue-on-error: true
        run: node scripts/build-injury-snapshot.mjs

      - name: Build derived aggregates (weekly game counts + positional FPPG)
        run: node apps/api/scripts/build-derived.mjs

      # Optional enrichment: player-tagged NHL.com stories plus a one-line fantasy
      # takeaway from Claude Haiku for new stories (skipped without the secret).
      # A failure keeps yesterday's snapshot and must not block the NHL data commit.
      - name: Fetch NHL.com player news
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-nhl-news.mjs

      # Optional enrichment: approved beat writers' Bluesky posts that name players
      # (config/bluesky-writers.json). Public API, no key; failure keeps yesterday's file.
      - name: Fetch Bluesky beat-writer posts
        continue-on-error: true
        run: node scripts/fetch-bluesky-posts.mjs

      - name: Show cache state
        run: npm run show:cache --prefix apps/api

      - name: Commit updated cache
        run: |
          git config user.name "hydrate-bot"
          git config user.email "hydrate-bot@users.noreply.github.com"
          git add apps/api/cache
          git add apps/api/data-cache
          git add apps/api/src/data/players.json
          git add data/*.json
          git add web/public/derived.json
          git add web/public/player-news.json
          git add web/public/injuries.json
          git add web/public/beat-posts.json
          if git diff --cached --quiet; then
            echo "No cache changes."
          else
            msg="Nightly hydrate: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git commit -m "$msg"
            git pull --rebase --autostash
            git push
          fi
