name: Hydrate Coach Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # nightly at 05:00 UTC

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SCHEMA: ${{ secrets.SUPABASE_SCHEMA }}
      SUPABASE_CACHE_BUCKET: ${{ secrets.SUPABASE_CACHE_BUCKET }}
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install API dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/api

      - name: Hydrate cache
        run: pnpm hydrate
        working-directory: apps/api

      - name: Verify Supabase cache pointer
        run: pnpm exec tsx scripts/verifySupabaseCache.ts
        working-directory: apps/api
