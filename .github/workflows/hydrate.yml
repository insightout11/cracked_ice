name: Hydrate Coach Cache

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  hydrate:
    name: Hydrate Supabase Cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_CACHE_BUCKET: ${{ secrets.SUPABASE_CACHE_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - name: Install API dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/api

      - name: Hydrate and upload cache
        run: npx --yes --prefix apps/api tsx apps/api/scripts/hydrate.ts
        env:
          NHL_STATS_BASE: https://statsapi.web.nhl.com
          HYDRATE_TIMEOUT_MS: "20000"

      - name: Smoke check latest cache pointer
        run: npx --yes --prefix apps/api tsx apps/api/scripts/verifySupabaseCache.ts
