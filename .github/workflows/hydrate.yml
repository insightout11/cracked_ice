name: Hydrate Coach Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # nightly at 05:00 UTC

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SCHEMA: ${{ secrets.SUPABASE_SCHEMA }}
      SUPABASE_CACHE_BUCKET: ${{ secrets.SUPABASE_CACHE_BUCKET }}
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'pnpm'
          # cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install deps (root workspace)
        run: pnpm install --frozen-lockfile

      - name: Run hydrate script
        working-directory: apps/api
        run: npx tsx scripts/hydrate.ts

      - name: Smoke check cache files
        run: |
          test -f apps/api/cache/schedule.json
          test -f apps/api/cache/stats.json
          echo " Cache present"
