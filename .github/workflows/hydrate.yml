name: Hydrate Coach Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # nightly at 05:00 UTC

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Default working dir for run steps is apps/api,
    # but we'll install deps at the repo root where pnpm-lock.yaml lives.
    defaults:
      run:
        working-directory: apps/api

    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:       ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ANON_KEY:          ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SCHEMA:            ${{ secrets.SUPABASE_SCHEMA }}
      SUPABASE_CACHE_BUCKET:      ${{ secrets.SUPABASE_CACHE_BUCKET }}
      NODE_ENV:                   production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      #  Explicitly disable node caching to avoid the lockfile-path error
      - name: Setup Node.js (no cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'none'          # <-- important

      - name: Enable Corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm -v

      # Install deps from the repo root (where pnpm-lock.yaml is).
      - name: Install workspace deps
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Run the hydrator inside apps/api
      - name: Run hydrate script
        run: npx tsx scripts/hydrate.ts

      - name: Smoke check cache files
        run: |
          test -f cache/schedule.json
          test -f cache/stats.json
          echo " Cache present"
