name: Nightly Hydrate

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC  4:00 AM ET (standard time)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    env:
      DISABLE_LIVE_STATS: "false"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_CACHE_BUCKET: ${{ secrets.SUPABASE_CACHE_BUCKET }}
      ALLOW_FIXTURE_FALLBACK: ${{ secrets.ALLOW_FIXTURE_FALLBACK || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install --no-frozen-lockfile

      - name: Install apps/api dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: apps/api

      - name: Hydrate data cache
        run: pnpm -C apps/api hydrate

      - name: Generate team stats from NHL API
        run: node apps/api/scripts/calculate-team-stats.mjs
        env:
          STATS_SEASON: "20252026"

      - name: Copy to data-cache for production deployment
        run: |
          mkdir -p apps/api/data-cache
          cp apps/api/cache/stats.json apps/api/data-cache/stats.json
          echo "Synced fresh stats to data-cache directory"

      - name: Build manifest
        run: pnpm -C apps/api manifest

      - name: Copy manifest to cache for local dev
        run: cp apps/api/data-cache/manifest.json apps/api/cache/manifest.json

      - name: Copy hydrated data to root data directory for Vercel
        run: |
          mkdir -p data
          cp apps/api/cache/stats.json data/stats.json
          cp apps/api/cache/schedule.json data/schedule.json
          cp apps/api/cache/team_stats.json data/team_stats.json
          cp apps/api/src/data/players.json data/players.json
          cp server/data/teams.json data/teams.json
          echo "Copied hydrated data to data/ directory"

      - name: Show cache state
        run: pnpm -C apps/api show:cache

      - name: Verify live stats hydration
        uses: actions/github-script@v7
        env:
          ALLOW_FIXTURE_FALLBACK: ${{ env.ALLOW_FIXTURE_FALLBACK }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = path.join(process.env.GITHUB_WORKSPACE, 'apps/api/cache/.fixture');
            if (fs.existsSync(marker)) {
              const allow = (process.env.ALLOW_FIXTURE_FALLBACK || '').toLowerCase() === 'true';
              if (allow) {
                core.warning(`Fixture fallback detected via ${marker}`);
              } else {
                core.setFailed('Live hydration failed');
              }
            }

      - name: Commit updated cache
        run: |
          git config user.name "hydrate-bot"
          git config user.email "hydrate-bot@users.noreply.github.com"
          git add apps/api/cache
          git add apps/api/data-cache
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No cache changes."
          else
            tag=""
            if [ -f apps/api/cache/.fixture ]; then
              tag=" [fixture]"
            fi
            msg="Nightly hydrate${tag}: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            rm -f apps/api/cache/.fixture
            git commit -m "$msg"
            git pull --rebase
            git push
          fi
