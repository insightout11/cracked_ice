name: Nightly Hydrate

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC  1:00 AM ET (standard time)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    env:
      DISABLE_LIVE_STATS: "false"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_CACHE_BUCKET: ${{ secrets.SUPABASE_CACHE_BUCKET }}
      ALLOW_FIXTURE_FALLBACK: ${{ secrets.ALLOW_FIXTURE_FALLBACK || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Hydrate data cache
        run: pnpm -C apps/api hydrate
      - name: Hydrate team stats
        run: pnpm -C apps/api hydrate:teams
        env:
          TEAM_STATS_URL: ${{ secrets.TEAM_STATS_URL }}

      - name: Build manifest
        run: pnpm -C apps/api manifest

      - name: Show cache state
        run: pnpm -C apps/api show:cache

      - name: Verify live stats hydration
        uses: actions/github-script@v7
        env:
          ALLOW_FIXTURE_FALLBACK: ${{ env.ALLOW_FIXTURE_FALLBACK }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = path.join(process.env.GITHUB_WORKSPACE, 'apps/api/data-cache/.fixture');
            if (fs.existsSync(marker)) {
              const allow = (process.env.ALLOW_FIXTURE_FALLBACK || '').toLowerCase() === 'true';
              if (allow) {
                core.warning(`Fixture fallback detected via ${marker}`);
              } else {
                core.setFailed('Live hydration failed');
              }
            }

      - name: Commit updated cache
        run: |
          git config user.name "hydrate-bot"
          git config user.email "hydrate-bot@users.noreply.github.com"
          git add apps/api/data-cache
          if git diff --cached --quiet; then
            echo "No cache changes."
          else
            tag=""
            if [ -f apps/api/data-cache/.fixture ]; then
              tag=" [fixture]"
            fi
            msg="Nightly hydrate${tag}: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            rm -f apps/api/data-cache/.fixture
            git commit -m "$msg"
            git push
