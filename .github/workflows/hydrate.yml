name: Nightly Hydrate

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC  4:00 AM ET (standard time)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    env:
      DISABLE_LIVE_STATS: "false"
      REQUIRE_FRESH_HYDRATION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read season from config
        id: season
        run: echo "id=$(node -p "require('./config/season.json').seasonId")" >> "$GITHUB_OUTPUT"

      - run: npm install

      - name: Install apps/api dependencies
        run: npm install
        working-directory: apps/api

      - name: Typecheck hydration entrypoint
        run: npm run typecheck:hydrate
        working-directory: apps/api

      - name: Hydrate data cache
        run: npm run hydrate
        working-directory: apps/api
        env:
          STATS_SEASON: ${{ steps.season.outputs.id }}

      - name: Generate team stats from NHL API
        run: node apps/api/scripts/calculate-team-stats.mjs
        env:
          STATS_SEASON: ${{ steps.season.outputs.id }}

      - name: Finalize validated cache and manifest
        run: |
          mkdir -p apps/api/cache
          cp apps/api/cache/team_stats.json apps/api/data-cache/team_stats.json
          npm run manifest --prefix apps/api
          cp apps/api/data-cache/*.json apps/api/cache/

      - name: Copy hydrated data to root data directory for Vercel
        run: |
          mkdir -p data
          cp apps/api/data-cache/stats.json data/stats.json
          cp apps/api/data-cache/schedule.json data/schedule.json
          cp apps/api/data-cache/team_stats.json data/team_stats.json
          cp apps/api/src/data/players.json data/players.json
          cp server/data/teams.json data/teams.json
          echo "Copied hydrated data to data/ directory"

      - name: Build derived aggregates (weekly game counts + positional FPPG)
        run: node apps/api/scripts/build-derived.mjs

      - name: Show cache state
        run: npm run show:cache --prefix apps/api

      - name: Commit updated cache
        run: |
          git config user.name "hydrate-bot"
          git config user.email "hydrate-bot@users.noreply.github.com"
          git add apps/api/cache
          git add apps/api/data-cache
          git add apps/api/src/data/players.json
          git add data/*.json
          git add web/public/derived.json
          if git diff --cached --quiet; then
            echo "No cache changes."
          else
            msg="Nightly hydrate: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git commit -m "$msg"
            git pull --rebase --autostash
            git push
          fi
